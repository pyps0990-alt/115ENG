<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>學生端預覽</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
  /* 預覽用的切換列（只在這一頁） */
  .pv-switch { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 24px); padding: 8px; border-radius: 14px; background: #172E6E; border: 1px solid #0F1F4D; font: 800 .8rem/1 system-ui, sans-serif; }
  .pv-switch a { color: #fff; text-decoration: none; padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,.3); }
  .pv-switch a.on { background: #F59E0B; border-color: #F59E0B; color: #172E6E; }
  .pv-switch span { color: #FBBF24; padding: 7px 4px; }
</style>
</head>
<body>
<!-- 學生端預覽：用正式網站的程式（js/modes/*）與示範題目，成績送到假的伺服器，不會送到老師那裡 -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="brand" aria-label="回首頁"><span class="brand-mark">B5</span><span class="brand-text">Practice</span></a>
    <div class="top-actions"><div id="exam-unit" class="exam-unit"></div></div>
  </div>
</header>
<main id="app" class="container"><div class="focus"><section id="stage"></section></div></main>
<div id="fx"></div>
<nav class="pv-switch" aria-label="預覽切換" id="pv"></nav>
<script>
// 不能送出真的成績：Apps Script、Firebase 一律擋掉；伺服器計分改用下面的假伺服器
const realFetch = window.fetch;
window.fetch = (url, opt) => {
  if (/cloudfunctions\.net/.test(String(url)) && window.__fakeServer) return window.__fakeServer(url, opt);
  return /script\.google|googleapis|firebase|cloudfunctions/.test(String(url)) ? Promise.reject(new Error('預覽不送出')) : realFetch(url, opt);
};
</script>
<script type="module">
import { stripContent } from '../../js/answers.js';
import { gradeSubmission } from '../../js/grade.js';
import { LEVELS } from '../../js/levels.js';

const P = new URLSearchParams(location.search);
const type = P.get('type') || 'pattern';
const dl = P.get('dl') || 'today'; // 截止：today（今天 23:59）、soon（剩 40 分鐘）、none
const send = P.get('send') || 'ok'; // 送出結果：ok、queue（伺服器沒回應，先排隊）
// 切換列
const link = (k, v, label) => { const q = new URLSearchParams(location.search); q.set(k, v); return `<a href="?${q}" class="${(P.get(k) || { type: 'pattern', dl: 'today', send: 'ok' }[k]) === v ? 'on' : ''}">${label}</a>`; };
document.getElementById('pv').innerHTML = `<span>題型</span>${link('type', 'vocab', '單字')}${link('type', 'reading', '課文')}${link('type', 'pattern', '句型')}<span>截止</span>${link('dl', 'today', '今天')}${link('dl', 'soon', '剩 40 分')}${link('dl', 'none', '不顯示')}<span>送出</span>${link('send', 'ok', '成功')}${link('send', 'queue', '先排隊')}<a href="#" id="pv-reset">清除進度</a>`;
document.getElementById('pv-reset').onclick = (e) => { e.preventDefault(); Object.keys(localStorage).filter((k) => k.startsWith('b5p:') && k !== 'b5p:student').forEach((k) => localStorage.removeItem(k)); location.reload(); };
try { if (!localStorage.getItem('b5p:student')) localStorage.setItem('b5p:student', JSON.stringify({ cls: '306', seat: '20', name: '預覽同學', key: 'a'.repeat(64) })); } catch {}

const tw = (ms) => { const d = new Date(ms + 8 * 3600000); return d.toISOString().slice(0, 16); };
const closeAt = dl === 'soon' ? tw(Date.now() + 40 * 60000) : dl === 'today' ? `${tw(Date.now()).slice(0, 10)}T23:59` : '';
const DATA = {
  vocab: { words: [['accept', 'v.', '接受', 'I [accept] your apology.'], ['achieve', 'v.', '達成', 'She worked hard to [achieve] her goal.'], ['advice', 'n.', '建議', 'Thank you for your [advice].'], ['afford', 'v.', '負擔得起', 'We cannot [afford] a new car.'], ['amazing', 'adj.', '令人驚奇的', 'The view is [amazing].'], ['anxious', 'adj.', '焦慮的', 'He felt [anxious] before the test.']].map(([word, pos, zh, ex]) => ({ word, pos, zh, type: 'word', examples: [{ ex, zh: '' }] })) },
  reading: { title: 'The Value of Friendship', passage: ['Friendship is one of the most valuable things in life. Good friends support us when we face difficulties.', 'Research shows that a few close friends bring more happiness than many casual ones.', 'To keep a friendship strong, both people need to listen carefully and respect each other.'],
    questions: [{ skill: '細節', q: 'What brings people more happiness?', options: ['Many friends', 'A few close friends', 'Birthdays', 'Success'], answer: 1, explain: '第 2 段。', ref: '2-1' }, { skill: '主旨', q: 'What is the passage mainly about?', options: ['Making friends fast', 'Why friendship matters', 'Birthdays', 'School'], answer: 1, explain: '全文。', ref: '1-1' }, { skill: '細節', q: 'What keeps a friendship strong?', options: ['Money', 'Listening and respect', 'Gifts', 'Phones'], answer: 1, explain: '第 3 段。', ref: '3-1' }] },
  pattern: { items: [{ type: 'mc', q: 'He ____ here every day.', options: ['comes', 'come', 'coming', 'came'], answer: 0, explain: '主詞 he 第三人稱單數，現在式動詞加 s。', tag: '主詞動詞一致' }, { type: 'fill', q: 'I ____ (go) to school yesterday.', answer: 'went', hint: '(go)', explain: 'yesterday 用過去式 went。' }, { type: 'apply', zh: '我喜歡蘋果', words: ['apples', 'I', 'like'], answer: 'I like apples.', explain: '主詞＋動詞＋受詞。' }] },
};
const TITLE = { vocab: 'L3 單字片語', reading: 'L1 課文理解', pattern: 'L4 句型練習' };
const unit = { id: `pv-${type}`, title: TITLE[type], type };
const data = DATA[type];
const config = { units: { [unit.id]: { closeAt, questionCount: 3 } }, content: {} };
window.__fakeServer = async (url, opt) => {
  const body = JSON.parse(opt.body);
  await new Promise((r) => setTimeout(r, 600));
  if (body.op === 'key') return new Response(JSON.stringify({ ok: true, v: '', data }));
  if (send === 'queue') throw new TypeError('Failed to fetch');
  const g = gradeSubmission(body, data, config) || { score: body.score, total: body.total, pct: body.pct, details: body.details };
  return new Response(JSON.stringify({ ok: true, score: g.score, total: g.total, pct: g.pct, details: g.details, ...(type === 'vocab' ? {} : { data, v: '' }) }));
};
// 作答中：網站 header 右邊顯示單元名稱（正式網站由 js/app.js 依 body.dataset.busy 切換）
const exam = document.getElementById('exam-unit');
exam.textContent = unit.title;
new MutationObserver(() => document.body.classList.toggle('exam', !!document.body.dataset.busy)).observe(document.body, { attributes: true, attributeFilter: ['data-busy'] });
document.title = `${unit.title} — 學生端預覽`;
const mod = await import(`../../js/modes/${type}.js`);
const ctx = type === 'vocab'
  ? { unit, data, allWords: data.words, config, levels: LEVELS.filter((l) => l.mode !== 'review').slice(0, 3), analysis: null, perTest: 6, questionCount: 6 }
  : { unit, data: stripContent(data), config, questionCount: 3 };
mod.mount(document.getElementById('stage'), ctx);
document.body.dataset.ready = '1';
</script>
</body>
</html>
