<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container" id="h"></main>
<script type="module">
const calls = [];
window.fetch = async (url, o) => { const b = JSON.parse(o.body); calls.push(b.api); window.__calls = calls;
  const data = b.api === 'getAdminData' ? { units: [{ id: 'l1-voc', title: 'L1 單字片語', type: 'vocab', visible: true, disabled: [], questionCount: 10 }, { id: 'l1-reading', title: 'L1 課文', type: 'reading', visible: true, disabled: [], questionCount: 10 }], customUnits: [] }
    : b.api === 'getScores' ? [{ time: '2026-09-29 10:00', cls: '306', seat: '20', name: '測試', unit: 'l1-voc', unitTitle: 'L1', score: 25, total: 30, pct: 83, basic: '10/10', advanced: '8/10', mastery: '7/10', wrong: 'cite' }]
    : { ok: true };
  return { json: async () => ({ ok: true, data }) }; };
const { mountAdmin } = await import('/js/admin.js');
mountAdmin(document.getElementById('h'), { getToken: async () => 'tok', legacyUrl: 'https://example.com' });
</script></body></html>
