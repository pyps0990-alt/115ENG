# 自動部署網站（Firebase Hosting）。
# 觸發：推上 main，或在 GitHub 的 Actions 頁面手動執行（Run workflow，可以選任何分支）。
# 需要一次性設定：Repository secret「FIREBASE_SERVICE_ACCOUNT」＝服務帳戶金鑰（JSON 全文），步驟見 README「自動部署」。
# 只部署網站（hosting）；Apps Script、Cloud Functions、Firestore 規則另外部署。
name: Deploy hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查預載清單
        run: node tools/module-graph.mjs --check
      - name: 部署
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "還沒設定 FIREBASE_SERVICE_ACCOUNT（見 README「自動部署」）"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting --project eng-3385e --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
