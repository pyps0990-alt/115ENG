# 預覽網址：推上 claude/ 開頭的工作分支時，部署到 Firebase Hosting 的預覽頻道「preview」（網址固定、不影響正式網站 eng-3385e.web.app）。
# 網址會寫在這次執行的摘要（Actions → 這次執行 → Summary）。確認沒問題再合併到 main，正式網站才會更新。
# 注意：預覽網站用的是同一個資料庫（學生成績、題目都是正式資料）；只部署網站，不部署 Firestore 規則、Apps Script、Cloud Functions。
name: Deploy preview

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查預載清單
        run: node tools/module-graph.mjs --check
      - name: 部署到預覽頻道
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "還沒設定 FIREBASE_SERVICE_ACCOUNT（見 README「自動部署」）"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest hosting:channel:deploy preview --expires 30d --project eng-3385e --non-interactive --json > "$RUNNER_TEMP/out.json" || { cat "$RUNNER_TEMP/out.json"; rm -f "$RUNNER_TEMP/sa.json"; exit 1; }
          rm -f "$RUNNER_TEMP/sa.json"
          # 輸出前面會先有部署前步驟（版本號）的文字，直接找網址
          URL=$(grep -o 'https://eng-3385e--preview-[a-z0-9-]*\.web\.app' "$RUNNER_TEMP/out.json" | head -1)
          if [ -z "$URL" ]; then cat "$RUNNER_TEMP/out.json"; exit 1; fi
          echo "預覽網址：$URL"
          { echo "## 預覽網址"; echo; echo "- 學生端：$URL"; echo "- 老師後台：$URL/admin.html"; echo; echo "分支 \`${GITHUB_REF_NAME}\`，commit \`${GITHUB_SHA::7}\`。確認後合併到 main 才會更新正式網站。"; } >> "$GITHUB_STEP_SUMMARY"
